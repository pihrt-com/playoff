name: Kontrola názvů vydání

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [created, published, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.sha }}
      - name: Ověřit názvy všech vydání
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/check_release_titles.py
